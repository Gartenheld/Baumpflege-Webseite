# Baut die Website bei jeder Änderung (Prüfung auf allen Branches)
# und lädt sie nur von "main" aus per rsync über SSH zu Hostinger hoch.
# Einrichtung der Secrets und Variablen: docs/01-technik-und-deployment.md, Abschnitt Deployment.
name: Build und Deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nie zwei Deployments gleichzeitig
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    env:
      # Hochladen nur von "main" und erst, wenn die Variable DEPLOY_ENABLED auf true steht
      DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true' }}
      # Bis zur Liveschaltung ist NOINDEX nicht gesetzt oder true: Suchmaschinen bleiben ausgesperrt
      PUBLIC_NOINDEX: ${{ vars.NOINDEX || 'true' }}
      SITE_URL: ${{ vars.SITE_URL }}
      # Keine Nutzungsstatistik an Astro senden
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Inhalte und Code prüfen
        run: npm run check

      # Verkleinerte Fotos zwischenspeichern, damit nicht jeder Lauf alle Fotos neu berechnet
      - name: Bild-Cache laden
        uses: actions/cache@v6
        with:
          path: .astro-cache
          key: bilder-${{ hashFiles('src/bilder/**', 'src/inhalte/referenzen/**', 'package-lock.json') }}
          restore-keys: bilder-

      # Baut die Website und prüft danach alle Seiten: Links, Titles, Descriptions,
      # im Live-Build zusätzlich, dass kein „Platzhalter“ mehr vorkommt (scripts/pruefe-seiten.mjs)
      - name: Website bauen und prüfen
        run: npm run build

      - name: PHP-Dateien auf Syntaxfehler prüfen
        run: |
          find dist -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Vorschau kennzeichnen (noindex, optional Passwortschutz)
        if: env.PUBLIC_NOINDEX != 'false'
        env:
          HTPASSWD_PATH: ${{ vars.PREVIEW_HTPASSWD_PATH }}
        run: |
          {
            printf '\n# Vorschau: nicht indexieren\n'
            printf '<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n'
            if [ -n "$HTPASSWD_PATH" ]; then
              printf '\n# Vorschau: Passwortschutz\n'
              printf 'AuthType Basic\nAuthName "Vorschau"\nAuthUserFile %s\nRequire valid-user\n' "$HTPASSWD_PATH"
            fi
          } >> dist/.htaccess
          tail -n 12 dist/.htaccess

      - name: SSH-Zugang vorbereiten
        if: env.DEPLOY == 'true'
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Zu Hostinger hochladen
        if: env.DEPLOY == 'true'
        env:
          SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
          SSH_USER: ${{ vars.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          # --delete entfernt Dateien, die es in der neuen Version nicht mehr gibt.
          # Deshalb liegt nichts Eigenes des Servers in public_html (Formular-Zugangsdaten liegen außerhalb).
          # Geschützt bleiben .well-known (Zertifikate) und PHP-Einstellungsdateien.
          rsync -rlcz --delete --delay-updates --chmod=D755,F644 \
            --filter='P /.well-known/' \
            --filter='P /.user.ini' \
            --filter='P /php.ini' \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=yes" \
            dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH%/}/"
